<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6bcb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="측정기록">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>신뢰성 측정 기록</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#18212c;--sub:#667085;--ln:#e2e6ec;--pri:#0b6bcb;--prit:#fff;--pri2:#e6f0fb;--ok:#13803b;--okb:#e5f5ea;--ng:#d42c1f;--ngb:#fdeceb;--run:#9a5b00;--runb:#fff4e0;--key:#fff;--keyfn:#e8ecf2;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e131a;--card:#17202b;--tx:#e7ecf2;--sub:#93a0b1;--ln:#283444;--pri:#4b9ff2;--prit:#06121f;--pri2:#13283e;--ok:#4cd480;--okb:#12301f;--ng:#ff7a70;--ngb:#3b1917;--run:#f2b552;--runb:#33270f;--key:#212c39;--keyfn:#2b3848;--shadow:none}}
:root[data-theme=dark]{--bg:#0e131a;--card:#17202b;--tx:#e7ecf2;--sub:#93a0b1;--ln:#283444;--pri:#4b9ff2;--prit:#06121f;--pri2:#13283e;--ok:#4cd480;--okb:#12301f;--ng:#ff7a70;--ngb:#3b1917;--run:#f2b552;--runb:#33270f;--key:#212c39;--keyfn:#2b3848;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:0;background:none}
.sub{color:var(--sub)}.sm{font-size:12px}.center{text-align:center}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--ln)}
.top.slim{padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top))}
.brand{display:flex;gap:10px;align-items:center;flex:1}.brand small{display:block;color:var(--sub);font-size:12px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--pri);color:var(--prit);display:grid;place-items:center;font-size:20px;font-weight:700}
.ttl1{flex:1;font-size:16px}.ttl{flex:1;min-width:0}.ttl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl small{color:var(--sub)}
.ib{min-width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px}
.ib:active{background:var(--keyfn)}.ib.sm{min-width:32px;height:32px;font-size:13px;background:var(--keyfn)}.ib.dng{color:var(--ng)}
.ib.live{background:var(--ng);color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(212,44,31,.2)}}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 110px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15px}.card h3 small{font-weight:400;color:var(--sub);font-size:12px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.pcard .meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--sub);font-size:12px;margin:6px 0}
.prog{height:6px;background:var(--keyfn);border-radius:9px;overflow:hidden;margin:6px 0 4px}.prog i{display:block;height:100%;background:var(--pri)}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--keyfn);color:var(--sub);white-space:nowrap}
.badge.ok{background:var(--okb);color:var(--ok)}.badge.ng{background:var(--ngb);color:var(--ng)}.badge.run{background:var(--runb);color:var(--run)}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);margin-bottom:10px;outline:none}
.empty{text-align:center;padding:50px 10px}.empty .em{font-size:44px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:11px;background:var(--keyfn);font-weight:600}
.btn:active{filter:brightness(.92)}.btn.pri{background:var(--pri);color:var(--prit)}.btn.big{width:100%;padding:15px;font-size:16px;border-radius:14px}.btn.sm{padding:7px 14px}.btn.dng{color:var(--ng)}
.fabbar{position:fixed;left:0;right:0;bottom:0;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.fabbar>*{max-width:736px;margin:0 auto;display:flex}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:12px;background:var(--card);border:1px solid var(--ln);text-align:center;font-weight:600}
.tab small{display:block;font-weight:400;font-size:11px;color:var(--sub)}.tab.on{background:var(--pri);color:var(--prit);border-color:var(--pri)}.tab.on small{color:inherit;opacity:.85}
.verdict{padding:10px 14px;border-radius:12px;margin-bottom:10px;font-weight:700}
.verdict.ok{background:var(--okb);color:var(--ok)}.verdict.ng{background:var(--ngb);color:var(--ng)}.verdict.run{background:var(--runb);color:var(--run)}
.irow{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:11px 12px;margin-bottom:7px}
.irow .l{flex:1;min-width:0}.irow small{display:block;color:var(--sub);font-size:12px}.irow .m{text-align:right}.irow .m span{font-weight:700}
.tm{font-size:11px;color:var(--pri);font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.acts .btn{padding:13px 8px}.acts .full{grid-column:1/-1}
/* measure */
.mwrap{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:760px;margin:0 auto}
.mt{flex:1;min-width:0}.mt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stsel{border:0;background:var(--pri2);color:var(--pri);font-weight:700;font-size:12px;border-radius:8px;padding:2px 6px;max-width:100%}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--sub)}
.ichips{display:flex;gap:6px;overflow-x:auto;padding:8px;flex:none;scrollbar-width:none;border-bottom:1px solid var(--ln)}.ichips::-webkit-scrollbar{display:none}
.ichip{flex:none;padding:6px 12px;border-radius:10px;background:var(--card);border:1px solid var(--ln);font-weight:600;font-size:13px;text-align:center}
.ichip small{display:block;font-weight:400;font-size:11px;color:var(--sub)}.ichip em{color:var(--ng);font-style:normal;font-weight:700}
.ichip.done{border-color:var(--ok)}.ichip.on{background:var(--pri);color:var(--prit);border-color:var(--pri)}.ichip.on small,.ichip.on em{color:inherit}
.mscroll{flex:1;overflow-y:auto;padding:8px 10px;min-height:0}
.spec{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}.spec b{font-size:16px}
.mini-st{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}.mini-st b{color:var(--tx)}.ngt{color:var(--ng);font-style:normal;font-weight:700}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:8px}
.cell{border-radius:9px;background:var(--card);border:1.5px solid var(--ln);padding:3px 2px 5px;text-align:center;min-width:0}
.cell small{display:block;font-size:10px;color:var(--sub);line-height:1.2}.cell span{display:block;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.ok{background:var(--okb);color:var(--ok);border-color:transparent}.cell.ng{background:var(--ngb);color:var(--ng);border-color:transparent}
.cell.adj{border-style:dashed;color:var(--pri)}.cell.adj span{font-weight:400}.sn{width:78px!important;flex:none}
.schips{display:flex;gap:5px;overflow-x:auto;padding:7px 8px 0;flex:none;scrollbar-width:none}.schips::-webkit-scrollbar{display:none}
.schip{flex:none;padding:5px 11px;border-radius:99px;background:var(--keyfn);font-size:12.5px;font-weight:700;color:var(--sub)}.schip small{font-weight:400}.schip em{color:var(--ng);font-style:normal;font-weight:700}
.schip.done{color:var(--ok)}.schip.on{background:var(--pri2);color:var(--pri);box-shadow:inset 0 0 0 1.5px var(--pri)}
.mt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.em span{color:var(--sub);font-weight:400}.cell.cur{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}
.tmr{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.tmr.done{border-color:var(--ok);background:var(--okb)}
.tleft{flex:1;min-width:0}.tmode{display:flex;gap:4px;flex-wrap:wrap}
.seg{font-size:11px;padding:3px 8px;border-radius:7px;background:var(--keyfn);color:var(--sub);font-weight:600}.seg.on{background:var(--pri2);color:var(--pri)}.seg.dur{color:var(--tx)}
.tdisp{font-variant-numeric:tabular-nums;font-weight:800;font-size:28px;letter-spacing:.5px;line-height:1.15;margin-top:2px}
.tmr.big .tdisp{font-size:40px}
.tbar{height:4px;background:var(--keyfn);border-radius:9px;overflow:hidden;margin-top:3px}.tbar i{display:block;height:100%;background:var(--pri);transition:width .1s linear}
.tbtns{display:flex;gap:6px}.tb{width:46px;height:46px;border-radius:12px;background:var(--keyfn);font-size:17px;font-weight:700}.tb.pri{background:var(--pri);color:var(--prit)}
.tmr.big .tb{width:54px;height:54px}
.heard{font-size:12.5px;padding:7px 10px;border-radius:10px;background:var(--ngb);color:var(--ng);margin-bottom:8px}
.dispbar{flex:none;padding:6px 12px 4px;border-top:1px solid var(--ln);background:var(--card)}
.dlabel{font-size:12px;font-weight:700;color:var(--pri)}
.disp{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;font-variant-numeric:tabular-nums;font-size:34px;font-weight:800;min-height:46px;border-radius:10px;padding:0 6px;transition:background .2s}
.disp .ph{color:var(--sub);opacity:.4}.disp .unit{font-size:15px;color:var(--sub);font-weight:600}
.disp.pv-ng{color:var(--ng)}.disp.pv-ok{color:var(--ok)}
.disp.flash-ok{background:var(--okb)}.disp.flash-ng{background:var(--ngb)}
.pad{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--card)}
.k{height:52px;border-radius:12px;background:var(--key);border:1px solid var(--ln);font-size:22px;font-weight:600;box-shadow:var(--shadow)}
.k:active{transform:scale(.96);filter:brightness(.92)}.k.fn{background:var(--keyfn);font-size:17px}.k.w2{grid-column:span 2}.k.w3{grid-column:span 3}
.k.ok{background:var(--pri);color:var(--prit);font-size:19px;font-weight:800;border-color:var(--pri)}
@media (max-height:700px){.k{height:44px}.tdisp{font-size:24px}.tmr.big .tdisp{font-size:32px}.disp{font-size:28px;min-height:38px}}
/* forms */
.form label{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-bottom:9px}
.form input:not([type=checkbox]),.form textarea,.sheet select{display:block;width:100%;margin-top:3px;padding:10px 11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);font-size:15px;color:var(--tx);outline:none}
.form input:focus,.form textarea:focus{border-color:var(--pri)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.srow{display:flex;gap:6px;align-items:center;margin-bottom:6px}.srow input{margin:0!important}
.itrow{border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--bg)}
.itrow input{background:var(--card)!important}
.g-it{display:grid;grid-template-columns:1fr 92px;gap:6px}.g-it2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.g-it3{display:flex;align-items:center;gap:6px;margin-top:4px}.g-it3 .sp{flex:1}
.mini{margin:0!important;font-size:11px!important}.mini input{padding:8px 10px!important}
.inl{display:flex!important;align-items:center;gap:4px}.inl input{width:64px!important;margin:0!important}
.ck{display:flex!important;align-items:center;gap:6px;margin:0!important;font-size:13px!important;color:var(--tx)!important}.ck input{width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:6px 10px;border-radius:99px;background:var(--pri2);color:var(--pri);font-size:12.5px;font-weight:600}
/* report */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--sub);font-weight:600;font-size:11.5px}.tblw{overflow-x:auto}
.up{color:var(--run)}.ng-c{color:var(--ng);font-weight:700}
.chart{width:100%;height:auto;display:block;margin:6px 0 4px}
.chart .gl{stroke:var(--ln)}.chart .ax{fill:var(--sub);font-size:9px}.chart .spec{stroke:var(--ng);stroke-dasharray:4 3}.chart .spl{fill:var(--ng);font-size:9px;font-weight:700}
.chart .dok{fill:var(--pri);opacity:.75}.chart .dng{fill:var(--ng)}.chart .mean{stroke:var(--tx);stroke-width:2}
/* modal/toast */
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#modal.hidden{display:none}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px}.sheet .btn{width:100%;margin-bottom:8px;justify-content:flex-start;padding:13px 14px}
.sheet textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);margin-bottom:10px}
.tog{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--ln);gap:10px}
.tog small{display:block;color:var(--sub);font-size:12px}.tog input{width:22px;height:22px;flex:none}
@media (min-width:700px){#modal{align-items:center}.sheet{border-radius:18px}}
#toast{position:fixed;left:50%;top:calc(118px + env(safe-area-inset-top));transform:translate(-50%,-260px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;transition:transform .25s;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{transform:translate(-50%,0)}
</style>

<body>
<div id="app"></div>
<div id="modal" class="hidden"></div>
<div id="toast"></div>
<script>
'use strict';
const VERSION='1.2.0';
const KEY='coway-rel-log.v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(v);return isFinite(n)?n:null};
const fmt=(v,d=3)=>(v==null||!isFinite(v))?'–':String(+v.toFixed(d));
const p2=n=>String(n).padStart(2,'0');
const trunc=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
function fmtDate(t,short){if(!t)return'';const d=new Date(t);const s=`${d.getMonth()+1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;return short?s:s+':'+p2(d.getSeconds())}
function isoLocal(t){if(!t)return'';const d=new Date(t);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`}
function ymd(){const d=new Date();return `${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}`}

const PRESETS=[
 {name:'최소 동작전압',unit:'V'},{name:'소비전류',unit:'mA'},{name:'소비전력',unit:'W'},
 {name:'회전수',unit:'rpm'},{name:'유량',unit:'L/min',timed:true,dur:60},{name:'UV 조사량',unit:'mW/cm²'},
 {name:'소음',unit:'dB(A)'},{name:'저항',unit:'Ω'},{name:'절연저항',unit:'MΩ'},
 {name:'누설전류',unit:'mA'},{name:'표면온도',unit:'℃'},{name:'압력',unit:'kPa'},{name:'동작시간',unit:'s'}
];
const STAGE_PRESETS=['초기','내열 후','내한 후','고온고습 후','열충격 후','환경시험 후','내구시험 후','진동 후','낙하 후','회복 후'];
const DEF_SET={autoNext:true,beep:true,vib:true,awake:true,voiceAuto:true,theme:'auto'};

/* ---------- storage ---------- */
let S=load();
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 d=d&&Array.isArray(d.parts)?d:{parts:[]};d.settings=Object.assign({},DEF_SET,d.settings||{});return d}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠ 저장 실패 (저장공간 부족?) — 백업하세요')}}

/* ---------- view state ---------- */
const V={name:'home',partId:null,stage:null,itemId:null,sample:0,input:'',q:'',heard:''};
const STK=[];let D=null;const UNDO=[];
const part=()=>S.parts.find(p=>p.id===V.partId);
const item=()=>{const p=part();return p&&p.items.find(i=>i.id===V.itemId)};
const nOf=(p,sid)=>{const s=p.stages.find(x=>x.id===sid);return (s&&s.n)||p.samples};
function getArr(p,sid,iid){const N=nOf(p,sid);p.data=p.data||{};const s=p.data[sid]=p.data[sid]||{};let a=s[iid];
 if(!Array.isArray(a))a=s[iid]=[];while(a.length<N)a.push(null);if(a.length>N)a.length=N;return a}

/* ---------- judging & stats ---------- */
function judge(v,it){if(v==null)return null;const l=num(it.lsl),u=num(it.usl);if(l==null&&u==null)return'NA';
 if(l!=null&&v<l)return'NG';if(u!=null&&v>u)return'NG';return'OK'}
function specText(it){const l=num(it.lsl),u=num(it.usl),un=it.unit?' '+it.unit:'';
 if(l!=null&&u!=null)return `기준 ${l} ~ ${u}${un}`;if(l!=null)return `기준 ≥ ${l}${un}`;if(u!=null)return `기준 ≤ ${u}${un}`;return `기준 없음${it.unit?' ('+it.unit+')':''}`}
function stats(arr,it){const vs=(arr||[]).filter(x=>x&&x.v!=null).map(x=>x.v);const n=vs.length;if(!n)return{n:0,ng:0};
 const mean=vs.reduce((a,b)=>a+b,0)/n,min=Math.min(...vs),max=Math.max(...vs);
 const sd=n>1?Math.sqrt(vs.reduce((a,b)=>a+(b-mean)**2,0)/(n-1)):0;
 const l=num(it.lsl),u=num(it.usl);let cpk=null;
 if(sd>0){const c=[];if(u!=null)c.push((u-mean)/(3*sd));if(l!=null)c.push((mean-l)/(3*sd));if(c.length)cpk=Math.min(...c)}
 return{n,mean,min,max,sd,cpk,range:max-min,ng:vs.filter(v=>judge(v,it)==='NG').length}}
function progress(p,sid){let f=0,t=0,ng=0;(sid?p.stages.filter(s=>s.id===sid):p.stages).forEach(s=>p.items.forEach(it=>{const a=getArr(p,s.id,it.id);t+=a.length;a.forEach(x=>{if(x){f++;if(judge(x.v,it)==='NG')ng++}})}));
 return{pct:t?Math.round(f/t*100):0,ng,f,t}}

/* ---------- feedback ---------- */
let AC;function unlockAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(f=880,d=.12,vol=.25){if(!S.settings.beep)return;try{unlockAudio();const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
 g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d+.03)}catch(e){}}
function vib(p){if(S.settings.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
let WL=null;async function wake(on){try{if(on&&S.settings.awake&&'wakeLock'in navigator){if(!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}else if(!on&&WL){await WL.release();WL=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&V.name==='measure')wake(true)});
function applyTheme(){const t=S.settings.theme;if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t}

/* ---------- timer ---------- */
const T={mode:'down',dur:60,run:false,t0:0,acc:0,done:false,lastS:null};
const tEl=()=>T.acc+(T.run?(performance.now()-T.t0)/1000:0);
function tStr(){const el=tEl();const x=T.mode==='down'?Math.max(0,Math.ceil((T.dur-el)*10-1e-6)):Math.floor(el*10);const m=Math.floor(x/600);return `${p2(m)}:${((x%600)/10).toFixed(1).padStart(4,'0')}`}
const tPct=()=>T.mode==='down'?Math.min(100,tEl()/T.dur*100):(tEl()%60)/60*100;
function tStart(){unlockAudio();if(T.run){T.acc=tEl();T.run=false}else{if(T.done)tResetRaw();T.t0=performance.now();T.run=true;beep(880,.08)}updTimer(true)}
function tResetRaw(){T.run=false;T.acc=0;T.done=false;T.lastS=null}
function tReset(){tResetRaw();updTimer(true)}
function updTimer(full){const a=$('#tmr');if(!a)return;a.textContent=tStr();const b=$('#tbar');if(b)b.style.width=tPct()+'%';
 if(full){const c=$('#tbtn');if(c)c.textContent=T.run?'❚❚':'▶';const w=$('.tmr');if(w)w.classList.toggle('done',T.done)}}
const clockStr=()=>{const d=new Date();return `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`};
setInterval(()=>{if(V.name!=='measure')return;const c=$('#clock');if(c)c.textContent=clockStr();
 if(T.run&&T.mode==='down'){const rem=T.dur-tEl();if(rem<=0){T.run=false;T.acc=T.dur;T.done=true;beep(1000,.7,.35);vib([300,120,300]);toast(`⏱ ${T.dur}초 완료 — 값을 입력하세요`);updTimer(true);return}
  const s=Math.ceil(rem);if(s<=3&&s!==T.lastS){T.lastS=s;beep(660,.1)}}
 updTimer()},100);

/* ---------- navigation ---------- */
const snap=()=>({name:V.name,partId:V.partId,stage:V.stage,itemId:V.itemId,sample:V.sample});
function go(name,o={}){STK.push(snap());history.pushState({n:STK.length},'');Object.assign(V,{name},o);if(name==='measure')setItem(V.itemId);render();window.scrollTo(0,0)}
window.addEventListener('popstate',()=>{closeModal();const s=STK.pop();if(s)Object.assign(V,s);else V.name='home';render()});
function back(){if(STK.length)history.back();else{V.name='home';render()}}

function render(){
 if(V.name!=='measure'){if(voiceOn)stopVoice();wake(false)}else wake(true);
 const app=$('#app');const sc=$('#ichips')?.scrollLeft,sc2=$('#schips')?.scrollLeft;
 const R={home:renderHome,part:renderPart,edit:renderEdit,measure:renderMeasure,report:renderReport}[V.name]||renderHome;
 app.innerHTML=R();
 if(V.name==='measure'){const ic=$('#ichips');if(ic&&sc!=null)ic.scrollLeft=sc;const sc_=$('#schips');if(sc_&&sc2!=null)sc_.scrollLeft=sc2;$('.ichip.on')?.scrollIntoView({inline:'nearest',block:'nearest'});$('.schip.on')?.scrollIntoView({inline:'nearest',block:'nearest'});

}

function updateDisp(){const d=$('#disp');if(!d)return;const it=item();const v=num(V.input);
 d.innerHTML=`${V.input?esc(V.input):'<span class="ph">0</span>'}<span class="unit">${esc(it?.unit||'')}</span>`;
 d.classList.remove('pv-ok','pv-ng');if(v!=null&&it){const j=judge(v,it);if(j==='NG')d.classList.add('pv-ng');else if(j==='OK')d.classList.add('pv-ok')}
 if(V.flash){d.classList.add('flash-'+(V.flash==='NG'?'ng':'ok'));const f=V.flash;V.flash=null;setTimeout(()=>d.classList.remove('flash-ok','flash-ng'),f==='NG'?900:450)}}

function setItem(id){const p=part();if(!p)return;const it=p.items.find(i=>i.id===id)||p.items[0];V.itemId=it.id;const a=getArr(p,V.stage,it.id);
 const e=a.findIndex(x=>!x);V.sample=e>=0?e:0;V.input='';
 if(!T.run){if(it.timed){T.mode='down';T.dur=it.dur||60}tResetRaw()}}

function key(k){let s=V.input;
 if(/^\d$/.test(k)){if(s.replace(/[-.]/g,'').length<12)s=(s==='0'?'':s==='-0'?'-':s)+k}
 else if(k==='.'){if(!s.includes('.'))s=(s===''||s==='-'?s+'0':s)+'.'}
 else if(k==='±')s=s.startsWith('-')?s.slice(1):'-'+s;
 else if(k==='⌫')s=s.slice(0,-1);else if(k==='C')s='';
 V.input=s;vib(8);updateDisp()}

function commit(){const v=parseFloat(V.input);if(!isFinite(v)){toast('값을 입력하세요');return}
 const p=part(),it=item(),arr=getArr(p,V.stage,it.id),i=V.sample;
 UNDO.push({pid:p.id,sid:V.stage,iid:it.id,i,prev:arr[i]?{...arr[i]}:null});if(UNDO.length>100)UNDO.shift();
 arr[i]={v,t:Date.now(),n:arr[i]?.n||''};p.updated=Date.now();save();V.last=`${p.stages.find(s=>s.id===V.stage).name} #${i+1} · ${it.name} ${fmt(v,4)} ${it.unit||''}`;
 const j=judge(v,it);if(j==='NG'){vib([90,60,90,60,250]);beep(300,.3,.3);toast(`⚠ #${i+1} ${fmt(v,4)} 기준 이탈 (NG)`)}else{vib(25);beep(1300,.05,.15)}
 V.flash=j;V.input='';
 let nx=arr.findIndex((x,k)=>k>i&&!x);if(nx<0)nx=arr.findIndex(x=>!x);
 if(nx>=0)V.sample=nx;
 else{beep(1500,.12);if(S.settings.autoNext){const idx=p.items.findIndex(x=>x.id===it.id);const rest=[...p.items.slice(idx+1),...p.items.slice(0,idx)];
  const nit=rest.find(x=>getArr(p,V.stage,x.id).some(y=>!y));if(nit){setItem(nit.id);toast(`✓ ${it.name} 완료 → 다음: ${nit.name}`)}else toast(`✓ 이 단계 전 항목 측정 완료!`)}else toast(`✓ ${it.name} ${nOf(p,V.stage)}개 측정 완료`)}
 render()}
function undo(){const u=UNDO.pop();if(!u){toast('되돌릴 기록이 없어요');return}const p=S.parts.find(x=>x.id===u.pid);if(!p)return;
 getArr(p,u.sid,u.iid)[u.i]=u.prev;p.updated=Date.now();save();V.partId=p.id;V.stage=u.sid;V.itemId=u.iid;V.sample=u.i;V.input='';toast(`↶ #${u.i+1} 입력 취소`);render()}
function skip(){const p=part();V.sample=(V.sample+1)%nOf(p,V.stage);V.input='';render()}

/* ---------- voice ---------- */
let REC=null,voiceOn=false;
const DIG={'영':0,'공':0,'일':1,'이':2,'삼':3,'사':4,'오':5,'육':6,'륙':6,'칠':7,'팔':8,'구':9};
function koInt(s){if(/^\d+$/.test(s))return+s;let tot=0,sec=0,n=0,has=false;
 for(const ch of s){if(DIG[ch]!=null){n=DIG[ch];has=true}else if(/\d/.test(ch)){n=n*10+(+ch);has=true}
  else if(ch==='십'||ch==='백'||ch==='천'){sec+=(has?n:1)*({십:10,백:100,천:1000}[ch]);n=0;has=false}
  else if(ch==='만'){tot+=((sec+n)||1)*10000;sec=0;n=0;has=false}else return null}
 return tot+sec+n}
function parseSpoken(c){let s=c.replace(/마이너스|minus/gi,'-').replace(/[쩜점]/g,'.').replace(/,/g,'');
 s=s.replace(/[^0-9.\-영공일이삼사오육륙칠팔구십백천만]/g,'');if(!s||s==='-'||s==='.')return null;
 if(/^-?\d*\.?\d+$/.test(s))return parseFloat(s);
 let neg=false;if(s[0]==='-'){neg=true;s=s.slice(1)}const parts=s.split('.');if(parts.length>2)return null;
 const I=koInt(parts[0]||'영');if(I==null)return null;let Dd='';
 for(const ch of parts[1]||''){const d=DIG[ch]!=null?DIG[ch]:(/\d/.test(ch)?+ch:null);if(d==null)return null;Dd+=d}
 const v=parseFloat(I+(Dd?'.'+Dd:''));return isFinite(v)?(neg?-v:v):null}
function toggleVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){toast('이 브라우저는 음성 입력을 지원하지 않아요 (Chrome/Safari 최신 버전)');return}
 if(voiceOn){stopVoice();render();return}
 REC=new SR();REC.lang='ko-KR';REC.continuous=true;REC.interimResults=false;REC.maxAlternatives=1;
 REC.onresult=e=>{for(let k=e.resultIndex;k<e.results.length;k++)if(e.results[k].isFinal)handleSpeech(e.results[k][0].transcript)};
 REC.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){voiceOn=false;toast('마이크 권한을 허용해 주세요');render()}};
 REC.onend=()=>{if(voiceOn&&V.name==='measure')setTimeout(()=>{try{REC.start()}catch(e){}},150)};
 voiceOn=true;V.heard='';try{REC.start()}catch(e){}unlockAudio();render();toast('🎤 숫자를 말하면 바로 기록돼요')}
function stopVoice(){voiceOn=false;try{REC&&REC.stop()}catch(e){}}
const UNIT_ALIAS={rpm:['알피엠','알피앰'],ma:['밀리암페어','미리암페어','밀리'],v:['볼트'],w:['와트'],'l/min':['리터'],'db(a)':['데시벨','디비'],'℃':['도'],kpa:['킬로파스칼']};
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&');
function takeKey(str,keys){keys=keys.filter(k=>k[0]).sort((a,b)=>b[0].length-a[0].length);
 for(const[k,id]of keys){const re=new RegExp([...k].map(reEsc).join('\\s*'),'i');if(re.test(str))return{str:str.replace(re,' '),id}}return null}
function parseTarget(s){const p=part();if(!p)return null;let str=' '+s+' ',sid=null,iid=null,idx=null,val=null;
 const sk=[];p.stages.forEach(st=>{const nm=st.name.replace(/\s/g,'');const base=nm.replace(/(시험)?후$/,'').replace(/시험$/,'');sk.push([nm,st.id]);if(base&&base!==nm)sk.push([base,st.id])});
 let m=takeKey(str,sk);if(m){str=m.str;sid=m.id}
 const ik=p.items.map(it=>[it.name.replace(/\s/g,''),it.id]);const uc={};p.items.forEach(it=>{const u=(it.unit||'').toLowerCase();if(u)uc[u]=(uc[u]||0)+1});
 p.items.forEach(it=>{const u=(it.unit||'').toLowerCase();if(!u||uc[u]!==1)return;if(u.length>=2)ik.push([u,it.id]);(UNIT_ALIAS[u]||[]).forEach(a=>ik.push([a,it.id]))});
 m=takeKey(str,ik);if(m){str=m.str;iid=m.id}
 const beon=/번/.test(str);if(!sid&&!iid&&!beon)return null;
 let raw=str.replace(/번(째)?/g,' ').split(/[\s,]+/).filter(Boolean);while(raw.length&&parseSpoken(raw[0])==null)raw.shift();
 if(sid||beon){if(raw.length>=2){idx=parseSpoken(raw[0]);val=parseSpoken(raw.slice(1).join(''))}else if(raw.length===1)idx=parseSpoken(raw[0])}
 else val=parseSpoken(raw.join(''));
 if(idx!=null){idx=Math.round(idx)-1;if(idx<0||idx>=200)idx=null}
 return{sid,iid,idx,val}}
function applyTarget(r){const p=part();if(r.sid)V.stage=r.sid;setItem(r.iid||V.itemId);
 if(r.idx!=null){const st=p.stages.find(s=>s.id===V.stage),N=nOf(p,V.stage);if(r.idx>=N){st.n=r.idx+1;p.items.forEach(it=>getArr(p,V.stage,it.id));save();toast(`${st.name} 시료 수 → ${r.idx+1}개로 늘림`)}V.sample=r.idx}
 if(r.val!=null){V.input=String(r.val);if(S.settings.voiceAuto)return commit()}
 else toast(`→ ${p.stages.find(s=>s.id===V.stage).name} · ${item().name} · #${V.sample+1}`);
 render()}
function handleSpeech(t){if(V.name!=='measure')return;const s=t.trim(),c=s.replace(/\s/g,'');V.heard=s;
 if(/취소|되돌|지워/.test(c))return undo();if(/^(다음|넘겨|스킵|패스)/.test(c))return skip();
 if(/시작|스타트/.test(c)){if(!T.run)tStart();return render()}if(/정지|스톱|멈춰|중지/.test(c)){if(T.run)tStart();return render()}
 if(/리셋|초기화/.test(c)){tResetRaw();return render()}
 const r=parseTarget(s);if(r)return applyTarget(r);
 const v=parseSpoken(c);if(v==null){toast(`“${s}” — 숫자로 인식하지 못했어요`);return render()}
 V.input=String(v);if(S.settings.voiceAuto)commit();else{render()}}

/* ---------- report ---------- */
function chart(p,it){const W=320,H=150,L=40,R=8,Tp=10,B=22;
 const groups=p.stages.map(s=>getArr(p,s.id,it.id).map(x=>x?x.v:null));const all=groups.flat().filter(v=>v!=null);if(!all.length)return'';
 const l=num(it.lsl),u=num(it.usl),ex=[l,u].filter(v=>v!=null);let lo=Math.min(...all,...ex),hi=Math.max(...all,...ex);
 if(lo===hi){lo-=1;hi+=1}const pd=(hi-lo)*.12;lo-=pd;hi+=pd;const y=v=>(Tp+(H-Tp-B)*(1-(v-lo)/(hi-lo))).toFixed(1);const gw=(W-L-R)/groups.length;
 let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">`;
 for(let k=0;k<=2;k++){const v=lo+(hi-lo)*k/2;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L-4}" y="${+y(v)+3}" class="ax" text-anchor="end">${fmt(v,2)}</text>`}
 [['LSL',l],['USL',u]].forEach(([nm,v])=>{if(v!=null)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="spec"/><text x="${W-R}" y="${+y(v)-3}" class="spl" text-anchor="end">${nm} ${v}</text>`});
 groups.forEach((g,gi)=>{const cx=L+gw*(gi+.5),m=g.length,vs=g.filter(v=>v!=null);
  g.forEach((v,k)=>{if(v==null)return;const jx=cx+(m>1?(k/(m-1)-.5)*gw*.55:0);s+=`<circle cx="${jx.toFixed(1)}" cy="${y(v)}" r="3" class="${judge(v,it)==='NG'?'dng':'dok'}"/>`});
  if(vs.length){const mn=vs.reduce((a,b)=>a+b,0)/vs.length;s+=`<line x1="${cx-gw*.35}" x2="${cx+gw*.35}" y1="${y(mn)}" y2="${y(mn)}" class="mean"/>`}
  s+=`<text x="${cx}" y="${H-6}" class="ax" text-anchor="middle">${esc(trunc(p.stages[gi].name,9))}</text>`});return s+'</svg>'}
function summaryRows(p){const rows=[];p.items.forEach(it=>{let base=null;p.stages.forEach((s,si)=>{const r_s=s,st=stats(getArr(p,s.id,it.id),it);
 if(si===0)base=st.n?st.mean:null;const ch=(si>0&&base&&st.n)?(st.mean-base)/Math.abs(base)*100:null;
 const verdict=!st.n?'미측정':st.ng?'불합격':st.n<nOf(p,r_s.id)?'진행중':(num(it.lsl)==null&&num(it.usl)==null?'기준없음':'합격');
 rows.push({it,s,st,ch,verdict})})});return rows}

  return `<section class="card"><div class="row"><b>${esc(it.name)}</b><span class="sub sm">${esc(specText(it))}</span></div>${chart(p,it)}
  <div class="tblw"><table class="tbl"><tr><th>단계</th><th>n</th><th>평균</th><th>최소</th><th>최대</th><th>σ</th><th>Cpk</th><th>NG</th><th>초기대비</th></tr>
  ${rs.map(r=>`<tr><td>${esc(r.s.name)}</td><td>${r.st.n}</td><td><b>${fmt(r.st.mean)}</b></td><td>${fmt(r.st.min)}</td><td>${fmt(r.st.max)}</td><td>${r.st.n>1?fmt(r.st.sd):'–'}</td><td>${r.st.cpk!=null?fmt(r.st.cpk,2):'–'}</td><td class="${r.st.ng?'ng-c':''}">${r.st.n?r.st.ng:'–'}</td><td class="${r.ch!=null&&Math.abs(r.ch)>=10?'up':''}">${r.ch!=null?(r.ch>0?'+':'')+r.ch.toFixed(1)+'%':'–'}</td></tr>`).join('')}</table></div></section>`}).join('');

 modal(`<h3>내보내기 · ${esc(p.name)}</h3><button class="btn" data-act="exRaw">⤓ 원시 데이터 CSV (시료별 전체)</button><button class="btn" data-act="exSum">⤓ 요약 CSV (평균·최소·최대·σ·Cpk·판정)</button>
 <button class="btn" data-act="cpSum">⧉ 요약표 복사 (엑셀 붙여넣기용)</button><button class="btn" data-act="cpRaw">⧉ 원시 데이터 복사</button>
 ${sh?'<button class="btn" data-act="shSum">↗ 요약 CSV 공유 (메신저·메일)</button>':''}<button class="btn" data-act="exJson">⤓ 이 부품 백업 (JSON)</button>
 <button class="btn pri" data-act="close" style="justify-content:center">닫기</button>`)}
function cellModal(i){const p=part(),it=item(),x=getArr(p,V.stage,it.id)[i];const j=judge(x.v,it);
 modal(`<h3>시료 #${i+1} · ${fmt(x.v,4)} ${esc(it.unit)} ${j==='NG'?'<span class="badge ng">NG</span>':j==='OK'?'<span class="badge ok">OK</span>':''}</h3>
 <p class="sub sm">${esc(it.name)} · 측정 ${isoLocal(x.t)}</p><textarea id="cnote" rows="3" placeholder="메모 (예: 초기 기동 불안정, 재측정)">${esc(x.n||'')}</textarea>
 <button class="btn pri" data-act="saveNote" data-i="${i}" style="justify-content:center">메모 저장</button><button class="btn dng" data-act="delCell" data-i="${i}">값 삭제</button><button class="btn" data-act="close">닫기</button>`)}

/* ---------- actions ---------- */
const ACT={
 back,close:closeModal,settings:settingsModal,
 newPart:()=>openEditor(null),
 demo(){const st=[{id:uid(),name:'초기'},{id:uid(),name:'내열 후',n:3},{id:uid(),name:'내한 후',n:3},{id:uid(),name:'고온고습 후',n:3},{id:uid(),name:'열충격 후',n:3},{id:uid(),name:'내구시험 후',n:5}];
  S.parts.push({id:uid(),name:'예시) 정수 펌프 모터',code:'PM-24V-01',maker:'',lot:'',note:'예시 부품입니다. 자유롭게 수정·삭제하세요.',samples:10,stages:st,
  items:[newItem({name:'최소 동작전압',unit:'V',usl:'18'}),newItem({name:'소비전류',unit:'mA',lsl:'300',usl:'450'}),newItem({name:'회전수',unit:'rpm',lsl:'2800',usl:'3200'}),newItem({name:'유량',unit:'L/min',lsl:'1.2',timed:true,dur:60}),newItem({name:'소음',unit:'dB(A)',usl:'45'})],
  data:{},created:Date.now(),updated:Date.now()});save();render()},
 openPart:(el,id)=>{const p=S.parts.find(x=>x.id===id);go('part',{partId:id,stage:p.stages[0].id})},
 stage:(el,id)=>{V.stage=id;render()},
 editPart:()=>openEditor(part()),
 measureItem:(el,id)=>go('measure',{itemId:id}),
 startMeasure(){const p=part();const it=p.items.find(x=>getArr(p,V.stage,x.id).some(y=>!y))||p.items[0];go('measure',{itemId:it.id})},
 report:()=>go('report'),exportMenu:exportModal,
 dupPart(){const p=part();const c=JSON.parse(JSON.stringify(p));c.id=uid();c.name=p.name+' (복제)';c.lot='';c.data={};c.created=c.updated=Date.now();S.parts.push(c);save();
  toast('복제했어요 (측정값 제외) — 이름·Lot을 수정하세요');V.partId=c.id;V.stage=c.stages[0].id;render()},
 delPart(){const p=part();if(!confirm(`‘${p.name}’과 모든 측정값을 삭제할까요?`))return;S.parts=S.parts.filter(x=>x.id!==p.id);save();back()},
 pickItem:(el,id)=>{setItem(id);render()},
 pickStage:(el,id)=>{V.stage=id;setItem(V.itemId);render()},
 key:el=>key(el.dataset.k),commit,undo,skip,
 cell(el){const i=+el.dataset.i,p=part(),it=item(),a=getArr(p,V.stage,it.id);if(i===V.sample&&a[i]){cellModal(i);return}V.sample=i;V.input='';render()},
 saveNote(el){const i=+el.dataset.i,p=part(),x=getArr(p,V.stage,V.itemId)[i];if(x){x.n=$('#cnote').value.trim();p.updated=Date.now();save()}closeModal();render()},
 delCell(el){const i=+el.dataset.i,p=part(),a=getArr(p,V.stage,V.itemId);UNDO.push({pid:p.id,sid:V.stage,iid:V.itemId,i,prev:a[i]});a[i]=null;V.sample=i;save();closeModal();toast('삭제했어요 (↶ 취소로 복구 가능)');render()},
 voice:toggleVoice,
 tStart,tReset,
 tMode(el){T.mode=el.dataset.m;tResetRaw();render()},
 tDur(){const v=prompt('카운트다운 시간 (초)',T.dur);const n=parseInt(v);if(n>0){T.dur=n;tResetRaw();render()}},
 tUse(){V.input=String(+tEl().toFixed(1));updateDisp()},
 saveEdit,
 nPreset(el){D.samples=+el.dataset.n;render()},
 nAdd(){const p=part(),s=p.stages.find(x=>x.id===V.stage),N=nOf(p,V.stage);if(N>=200)return toast('최대 200개');s.n=N+1;getArr(p,V.stage,V.itemId);V.sample=N;V.input='';p.updated=Date.now();save();toast(`이 단계 시료 수 → ${N+1}개`);render()},
 nDel(){const p=part(),s=p.stages.find(x=>x.id===V.stage),N=nOf(p,V.stage);if(N<=1)return;const filled=p.items.filter(it=>{const a=(p.data[V.stage]||{})[it.id];return a&&a[N-1]}).length;
  if(filled&&!confirm(`#${N} 시료에 입력된 값 ${filled}개(전 항목)가 삭제돼요. 계속할까요?`))return;s.n=N-1;p.items.forEach(it=>getArr(p,V.stage,it.id));if(V.sample>=N-1)V.sample=N-2;V.input='';p.updated=Date.now();save();toast(`이 단계 시료 수 → ${N-1}개`);render()},
 itAdd(){D.items.push(newItem());render()},
 itPreset:el=>{D.items.push(newItem({...PRESETS[+el.dataset.id]}));render()},
 itDel:el=>{D.items.splice(+el.dataset.id,1);render()},
 itMv(el){const i=+el.dataset.id,j=i+(+el.dataset.d);if(j<0||j>=D.items.length)return;[D.items[i],D.items[j]]=[D.items[j],D.items[i]];render()},
 sgAdd(el){let n=el.dataset.n;if(!n){n=prompt('시험 단계 이름');if(!n||!n.trim())return}D.stages.push({id:uid(),name:n.trim()});render()},
 sgDel:el=>{D.stages.splice(+el.dataset.id,1);render()},
 sgMv(el){const i=+el.dataset.id;if(i<1)return;[D.stages[i-1],D.stages[i]]=[D.stages[i],D.stages[i-1]];render()},
 exRaw(){const p=part();download(safeName(`${p.name}_원시데이터_${ymd()}.csv`),toCSV(rawTable(p)))},
 exSum(){const p=part();download(safeName(`${p.name}_요약_${ymd()}.csv`),toCSV(sumTable(p)))},
 cpSum(){copyText(sumTable(part()).map(r=>r.join('\t')).join('\n'))},
 cpRaw(){copyText(rawTable(part()).map(r=>r.join('\t')).join('\n'))},
 shSum(){const p=part();shareFile(safeName(`${p.name}_요약_${ymd()}.csv`),toCSV(sumTable(p)),'text/csv')},
 exJson(){const p=part();download(safeName(`${p.name}_백업_${ymd()}.json`),JSON.stringify({app:'rel-log',version:VERSION,parts:[p]},null,1),'application/json')},
 backup(){download(`신뢰성측정_전체백업_${ymd()}.json`,JSON.stringify({app:'rel-log',version:VERSION,parts:S.parts},null,1),'application/json')},
 importBtn:()=>$('#impf').click(),
 wipe(){if(!confirm('모든 부품과 측정값을 삭제할까요? 되돌릴 수 없어요.'))return;if(!confirm('정말 삭제할까요? (백업을 먼저 권장)'))return;S.parts=[];save();closeModal();V.name='home';STK.length=0;render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f)f(el,el.dataset.id,e)});

function onBind(e){const el=e.target,b=el.dataset.bind;if(!b)return;const val=el.type==='checkbox'?el.checked:el.value;
 if(b==='search'){V.q=val;$('#list').innerHTML=homeList();return}
 if(b==='stageSel'){if(e.type==='change'){V.stage=val;setItem(V.itemId);render()}return}
 if(b==='importFile'){if(e.type==='change'&&el.files[0])importJSON(el.files[0]);return}
 if(b.startsWith('set.')){if(e.type!=='change'&&el.type==='checkbox')return;S.settings[b.slice(4)]=val;save();if(b==='set.theme')applyTheme();if(b==='set.awake')wake(V.name==='measure');return}
 if(!D)return;
 if(b.startsWith('d.')){D[b.slice(2)]=val;return}
 if(b.startsWith('sg.')){D.stages[+b.slice(3)].name=val;return}
 if(b.startsWith('sgn.')){D.stages[+b.slice(4)].n=val;return}
 if(b.startsWith('it.')){const[,i,f]=b.split('.');D.items[+i][f]=val;if(f==='timed'&&e.type==='change')render()}}
document.addEventListener('input',onBind);document.addEventListener('change',onBind);
function importJSON(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);const ps=Array.isArray(d)?d:d.parts;if(!Array.isArray(ps))throw 0;let a=0,u=0;
 ps.forEach(p=>{if(!p||!p.id||!Array.isArray(p.items)||!Array.isArray(p.stages))return;const i=S.parts.findIndex(x=>x.id===p.id);if(i>=0){if(!confirm(`‘${p.name}’이 이미 있어요. 백업 내용으로 덮어쓸까요?`))return;S.parts[i]=p;u++}else{S.parts.push(p);a++}});
 save();closeModal();render();toast(`불러오기 완료 · 추가 ${a} · 갱신 ${u}`)}catch(e){toast('올바른 백업 파일이 아니에요')}};r.readAsText(file)}

document.addEventListener('keydown',e=>{if(V.name!=='measure'||!$('#modal').classList.contains('hidden'))return;if(e.target.matches('input,textarea,select'))return;
 const k=e.key;if(/^[0-9]$/.test(k))key(k);else if(k==='.'||k===','||k==='Decimal')key('.');else if(k==='-'||k==='Subtract')key('±');else if(k==='Backspace'){e.preventDefault();key('⌫')}
 else if(k==='Enter'){e.preventDefault();commit()}else if(k==='Escape')key('C');else if(k===' '){e.preventDefault();tStart()}else if(k==='ArrowRight')skip();else if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();undo()}});
window.addEventListener('beforeunload',()=>save());

applyTheme();history.replaceState({n:0},'');render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
